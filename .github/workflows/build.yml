name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Версия для выпуска в Releases, например v0.1.0 (пусто = просто сборка без выпуска)
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip freeze

      - name: ffmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # берём самую свежую стабильную ветку ffmpeg (n8.x, n7.x ...), а если её нет, то master
          $names = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq ".assets[].name"
          $pick = $names | Where-Object { $_ -match '^ffmpeg-n[\d.]+-latest-win64-gpl-shared-[\d.]+\.zip$' } | Sort-Object { [version](($_ -split '-')[1].TrimStart('n')) } | Select-Object -Last 1
          if (-not $pick) { $pick = "ffmpeg-master-latest-win64-gpl-shared.zip" }
          Write-Host "ffmpeg build: $pick"
          gh release download latest -R BtbN/FFmpeg-Builds -p $pick -O ffmpeg.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item ffmpeg_tmp\*\bin\*.dll ffmpeg\
          Copy-Item ffmpeg_tmp\*\bin\ffmpeg.exe ffmpeg\
          Copy-Item ffmpeg_tmp\*\bin\ffprobe.exe ffmpeg\
          Get-ChildItem ffmpeg | Format-Table Name, Length
          "$PWD\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Unit tests
        run: python -m pytest -q

      - name: Build
        shell: pwsh
        run: |
          python packaging/make_icon.py packaging/streamclipper.ico
          pyinstaller packaging/streamclipper.spec --noconfirm
          New-Item -ItemType Directory -Force dist\StreamClipper\bin | Out-Null
          Copy-Item ffmpeg\* dist\StreamClipper\bin\
          Get-ChildItem dist\StreamClipper | Format-Table Name, Length

      - name: Self-test (built exe)
        shell: pwsh
        run: |
          # убираем ffmpeg из PATH: программа должна найти тот, что лежит у неё в папке bin
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike "*\ffmpeg" }) -join ';'
          dist\StreamClipper\sc-worker.exe selftest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Window smoke test (built exe, screenshots)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:STREAMCLIPPER_HOME = "$PWD\shots\home"
          $env:STREAMCLIPPER_SCREENSHOT = "$PWD\shots\page"
          $env:STREAMCLIPPER_SCREENSHOT_MS = "2500"
          $p = Start-Process -FilePath dist\StreamClipper\StreamClipper.exe -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "window did not exit"; exit 1 }
          Get-ChildItem shots\*.png | Format-Table Name, Length
          if (-not (Test-Path shots\page_4.png)) { exit 1 }

      - name: Vertical clip with chat (built exe)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python packaging/vertical_smoke.py dist\StreamClipper\sc-worker.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Live Twitch smoke test (built exe)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 25
        env:
          SMOKE_OUT: smoke_clips
          PYTHONUTF8: "1"
        run: |
          python packaging/live_smoke.py dist\StreamClipper\sc-worker.exe 240

      - name: Installer
        shell: pwsh
        run: |
          $ver = (python -c "import streamclipper; print(streamclipper.__version__)")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\StreamClipper -DestinationPath dist\StreamClipper-portable.zip
          Get-ChildItem dist\*.exe, dist\*.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: StreamClipper-Setup
          path: dist/StreamClipper-Setup.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            shots/*.png
            smoke_clips/*
          if-no-files-found: ignore

      # Выпуск: либо пушем тега v*, либо ручным запуском этой сборки с указанной версией
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: StreamClipper ${{ inputs.release || github.ref_name }}
          body: |
            **Как поставить**

            1. Скачай `StreamClipper-Setup.exe` (ниже, в разделе Assets) и запусти.
            2. Если Windows покажет синее окно «Система Windows защитила ваш компьютер», нажми «Подробнее», затем «Выполнить в любом случае». Так бывает у всех новых программ без платной подписи.
            3. Открой StreamClipper, на вкладке «Стримы» вставь ссылку на Twitch-канал и нажми «Добавить».

            Клипы появляются на вкладке «Клипы» и в папке `Видео\StreamClipper`. Telegram подключается на вкладке «Telegram».

            `StreamClipper-portable.zip` это та же программа без установки: распакуй и запусти `StreamClipper.exe`.
          files: |
            dist/StreamClipper-Setup.exe
            dist/StreamClipper-portable.zip
          fail_on_unmatched_files: true
