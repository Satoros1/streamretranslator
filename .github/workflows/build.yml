name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip freeze

      - name: ffmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest -R BtbN/FFmpeg-Builds -p "ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip" -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item ffmpeg_tmp\*\bin\*.dll ffmpeg\
          Copy-Item ffmpeg_tmp\*\bin\ffmpeg.exe ffmpeg\
          Copy-Item ffmpeg_tmp\*\bin\ffprobe.exe ffmpeg\
          Get-ChildItem ffmpeg | Format-Table Name, Length
          "$PWD\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Unit tests
        run: pytest -q

      - name: Build
        shell: pwsh
        run: |
          python packaging/make_icon.py packaging/streamclipper.ico
          pyinstaller packaging/streamclipper.spec --noconfirm
          New-Item -ItemType Directory -Force dist\StreamClipper\bin | Out-Null
          Copy-Item ffmpeg\* dist\StreamClipper\bin\
          Get-ChildItem dist\StreamClipper | Format-Table Name, Length

      - name: Self-test (built exe)
        shell: pwsh
        run: |
          # убираем ffmpeg из PATH: программа должна найти тот, что лежит у неё в папке bin
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike "*\ffmpeg" }) -join ';'
          dist\StreamClipper\sc-worker.exe selftest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Window smoke test (built exe, screenshots)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:STREAMCLIPPER_HOME = "$PWD\shots\home"
          $env:STREAMCLIPPER_SCREENSHOT = "$PWD\shots\page"
          $env:STREAMCLIPPER_SCREENSHOT_MS = "2500"
          $p = Start-Process -FilePath dist\StreamClipper\StreamClipper.exe -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "window did not exit"; exit 1 }
          Get-ChildItem shots\*.png | Format-Table Name, Length
          if (-not (Test-Path shots\page_4.png)) { exit 1 }

      - name: Live Twitch smoke test (built exe)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 25
        env:
          SMOKE_OUT: smoke_clips
        run: |
          python packaging/live_smoke.py dist\StreamClipper\sc-worker.exe 240

      - name: Installer
        shell: pwsh
        run: |
          $ver = (python -c "import streamclipper; print(streamclipper.__version__)")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\StreamClipper -DestinationPath dist\StreamClipper-portable.zip
          Get-ChildItem dist\*.exe, dist\*.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: StreamClipper-Setup
          path: dist/StreamClipper-Setup.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            shots/*.png
            smoke_clips/*
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StreamClipper-Setup.exe
            dist/StreamClipper-portable.zip
          generate_release_notes: true
